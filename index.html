<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COLOR DICE • ZERTIS</title>
<style>
:root{font-family:system-ui,-apple-system,'Arial Rounded MT Bold',sans-serif;color:white;--blue:#369fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 48% 18%,#7593b1 0,#547695 48%,#314b65 100%);display:flex;justify-content:center}.shell{width:min(100%,650px);min-height:100vh;border:7px solid white;border-radius:36px;padding:25px 24px 30px;box-shadow:inset 0 0 50px #ffffff18;display:flex;flex-direction:column;align-items:center;gap:28px}h1{font-size:clamp(3.4rem,12vw,5.8rem);margin:0 0 4px;font-weight:1000;letter-spacing:-4px;text-shadow:5px 7px 0 #0064c7,9px 12px 12px #213b55;-webkit-text-stroke:1.5px #0862bd}header{text-align:center;width:100%}.top{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:15px}.selector,.tag{min-height:75px;border:5px solid #349fff;border-radius:18px;background:white;color:#0763bc;display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:1000;text-shadow:1px 1px #bcdcff}.selector{cursor:pointer;gap:12px}.selector svg{width:19px}.tag{font-size:clamp(1rem,4.8vw,1.8rem)}.dice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;width:min(100%,370px);margin:auto 0; padding:28px 0}.die{aspect-ratio:1;border:13px solid white;border-radius:30px;display:grid;place-items:center;box-shadow:0 0 18px #fff9,7px 12px 19px #20364b80;transition:background .18s,transform .2s}.die span{width:22%;aspect-ratio:1;background:white;border-radius:50%;box-shadow:0 0 19px 7px #fff8}.die.rolling{animation:shake .38s ease-in-out}@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(.95)}65%{transform:rotate(8deg) scale(1.05)}}.roll{border:8px solid white;border-radius:22px;background:linear-gradient(#6bbaff,#319dff 75%,#9ed4ff);color:white;width:100%;padding:17px 12px;font-size:clamp(1.8rem,7vw,3.4rem);font-weight:1000;-webkit-text-stroke:1px #075eb5;text-shadow:2px 4px #1767b9;box-shadow:0 10px 17px #19344b70;cursor:pointer}.roll:active{transform:translateY(3px)}.footer{background:#182d40a6;border:2px solid #ffffff59;border-radius:18px;padding:16px;text-align:center;width:100%;line-height:1.6;font-size:clamp(.85rem,3.5vw,1.1rem)}.swatches{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}.swatches b{font-weight:900}.panel{width:100%;border:3px solid #5cb4ff;border-radius:18px;background:#142b44f0;padding:16px;box-shadow:0 15px 30px #14243888}.panel[hidden]{display:none}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.panel-head strong{font-size:1.05rem}.panel-head button{background:transparent;color:white;border:0;font-size:1.6rem;cursor:pointer}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:2px solid #ffffff66;background:#ffffff12;border-radius:12px;padding:10px 7px;display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:800;font-size:.88rem}.choice input{accent-color:#42a5ff;width:17px;height:17px}.dot{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid #fff8}.tip{margin:10px 0 0;color:#d1e7ff;font-size:.8rem}.counter{font-size:.8rem;opacity:.88;margin-top:-12px}@media(max-width:420px){.shell{border-width:5px;border-radius:25px;padding:19px 14px 22px;gap:20px}.dice{gap:15px;width:min(100%,300px);padding:12px 0}.die{border-width:10px;border-radius:24px}.top{gap:9px}.selector,.tag{min-height:62px;border-width:4px;font-size:1rem}.choices{grid-template-columns:repeat(2,1fr)}h1{letter-spacing:-2px}}
</style>
</head>
<body><main class="shell"><header><h1>G PERYA</h1></header>
<div class="top"><button class="selector" id="choose" aria-expanded="false" aria-controls="panel">COLORS <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m4 8 8 8 8-8"/></svg></button><div class="tag">COLOR DICE</div></div>
<section class="panel" id="panel" hidden><div class="panel-head"><strong>🎨 Couleurs autorisées</strong><button id="close" aria-label="Fermer">×</button></div><div class="choices" id="choices"></div><p class="tip">Sélectionne les couleurs qui peuvent apparaître. Au moins une doit rester active.</p></section>
<div class="dice" id="dice" aria-label="Quatre dés de couleurs"><div class="die"><span></span></div><div class="die"><span></span></div><div class="die"><span></span></div><div class="die"><span></span></div></div>
<button class="roll" id="roll">ROLL AGAIN !</button><div class="counter" id="counter" aria-live="polite">Lancers : 0</div><footer class="footer"><div>Possible colors are:</div><div class="swatches" id="legend"></div></footer></main>
<script>
const COLORS=[{name:'Red',hex:'#ff0808'},{name:'Orange',hex:'#ffa400'},{name:'Yellow',hex:'#ffdf00'},{name:'Green',hex:'#159b30'},{name:'Blue',hex:'#0800fa'},{name:'Purple',hex:'#8b008e'}];
const active=new Set(COLORS.map(c=>c.name));const dice=[...document.querySelectorAll('.die')];const choices=document.getElementById('choices');const legend=document.getElementById('legend');let rolls=0;let busy=false;
function render(){choices.replaceChildren();legend.replaceChildren();for(const color of COLORS){const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='checkbox';input.checked=active.has(color.name);input.setAttribute('aria-label',color.name);input.addEventListener('change',()=>{if(!input.checked&&active.size===1){input.checked=true;return}input.checked?active.add(color.name):active.delete(color.name);render()});const dot=document.createElement('span');dot.className='dot';dot.style.background=color.hex;label.append(input,dot,document.createTextNode(color.name));choices.append(label);if(active.has(color.name)){const b=document.createElement('b');b.textContent=color.name;b.style.color=color.hex;legend.append(b)}}}
function randomColor(){const allowed=COLORS.filter(c=>active.has(c.name));return allowed[Math.floor(Math.random()*allowed.length)]}
function paint(){dice.forEach(d=>{d.style.background=randomColor().hex})}
function roll(){if(busy)return;busy=true;dice.forEach(d=>d.classList.add('rolling'));let ticks=0;const timer=setInterval(()=>{paint();ticks++;if(ticks>=7){clearInterval(timer);dice.forEach(d=>d.classList.remove('rolling'));busy=false;rolls++;document.getElementById('counter').textContent=`Lancers : ${rolls}`}},55)}
const panel=document.getElementById('panel'),choose=document.getElementById('choose');function toggle(show){panel.hidden=!show;choose.setAttribute('aria-expanded',String(show))}choose.addEventListener('click',()=>toggle(panel.hidden));document.getElementById('close').addEventListener('click',()=>toggle(false));document.getElementById('roll').addEventListener('click',roll);render();paint();
</script></body></html>
